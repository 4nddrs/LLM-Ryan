<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #212121;
    --side: #171717;
    --ink: #ececec;
    --muted: #a3a3a3;
    --faint: #8a8a8a;
    --paper: #2f2f2f;
    --paper-2: #3a3a3a;
    --line: rgba(255, 255, 255, 0.1);
    --me: #303030;
    --pen: #ececec;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
  }
  * { scrollbar-width: thin; scrollbar-color: #3f3f3f transparent; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .ico { display: inline-flex; }
  .ico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .shell { display: flex; height: 100%; }
  aside {
    width: 260px;
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 10px 14px;
    background: var(--side);
    min-height: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    padding: 6px 10px 2px;
  }
  .brand strong { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  button.new {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
  }
  button.new:hover { background: var(--paper); }
  .side-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--faint);
    margin: 10px 10px 4px;
  }
  #meetings, #notes {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
  }
  #meetings { flex: 1; min-height: 0; }
  .meeting-row { display: flex; align-items: center; gap: 2px; }
  #meetings button.title, #notes button.note {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.35;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  #meetings button.title {
    flex: 1;
    width: auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .meeting-row { border-radius: 10px; }
  .meeting-row:hover, .meeting-row:has(.title.active) { background: var(--paper); }
  #meetings button.title.active { background: transparent; font-weight: 500; }
  #meetings button.mini, #notes button.x {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    padding: 0;
  }
  @media (hover: none) {
    button.copy { opacity: 1; }
  }
  #meetings button.mini:hover, #notes button.x:hover { color: var(--ink); background: var(--paper-2); }
  #meetings input.rename {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--pen);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13.5px;
  }
  .note-row { display: flex; align-items: flex-start; gap: 4px; }
  #notes button.note { flex: 1; cursor: default; }
  .side-foot { border-top: 1px solid var(--line); padding-top: 10px; }
  #notes { max-height: 22vh; }
  #notes button.note { color: var(--muted); font-size: 13px; }
  #note-form input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 13px;
  }
  #note-form input:focus { outline: 2px solid var(--pen); outline-offset: 1px; }
  .app {
    flex: 1;
    min-width: 0;
    display: flex;
    justify-content: center;
    padding: 0 clamp(20px, 4vw, 48px);
  }
  .column {
    width: 100%;
    max-width: 768px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  button.menu {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
  }
  button.menu:hover { background: var(--paper); }
  #scrim {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 20;
  }
  @media (max-width: 860px) {
    button.menu { display: inline-flex; }
    aside {
      position: fixed;
      z-index: 30;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(300px, 88vw);
      transform: translateX(-105%);
      transition: transform 0.18s ease;
    }
    aside.open { transform: none; }
    #scrim:not([hidden]) { display: block; }
  }
  header {
    position: relative;
    padding: 14px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
  }
  button.menu { position: absolute; left: 0; }
  .meta {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }
  .stage { flex: 1; min-height: 0; position: relative; }
  #log {
    height: 100%;
    overflow-y: auto;
    padding: 12px 0 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
    padding: 0 24px 8vh;
  }
  .empty[hidden] { display: none; }
  .empty strong {
    display: block;
    color: var(--ink);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .msg { max-width: 100%; white-space: pre-wrap; }
  .msg.user {
    align-self: flex-end;
    max-width: min(640px, 88%);
    background: var(--me);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 22px;
  }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .shots img, #pending img {
    display: block;
    max-width: 240px;
    max-height: 180px;
    width: auto;
    height: auto;
    border-radius: 12px;
    object-fit: contain;
    background: #111;
    cursor: zoom-in;
  }
  .shots img:hover, #pending img:hover { outline: 1px solid rgba(255, 255, 255, 0.28); }
  #pending { display: flex; flex-wrap: wrap; gap: 8px; }
  #pending:empty { display: none; }
  .thumb { position: relative; }
  .thumb button {
    position: absolute;
    top: 6px;
    right: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.72);
    color: var(--ink);
    cursor: pointer;
    width: 22px;
    height: 22px;
    padding: 0;
  }
  .msg.ryan { align-self: flex-start; }
  .who, .tag {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .tag { color: var(--muted); font-weight: 500; }
  .h {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 18px 0 6px;
  }
  .msg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .who { margin-bottom: 0; }
  button.copy {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 2px;
    display: inline-flex;
  }
  .msg.ryan:hover button.copy, button.copy:focus-visible { opacity: 1; }
  button.copy { opacity: 0; }
  button.copy:hover { color: var(--ink); }
  button.copy.done { color: var(--ink); opacity: 1; }
  .tag { margin-bottom: 6px; }
  .h { margin: 18px 0 6px; }
  .h:first-child { margin-top: 0; }
  .ascii {
    font: 12.5px/1.45 var(--mono);
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
    white-space: pre;
  }
  .dock {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 28px;
    padding: 12px 12px 10px;
    margin: 0 0 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .seg {
    display: inline-flex;
    align-self: flex-start;
    padding: 3px;
    gap: 2px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .seg button.on { background: var(--paper-2); color: var(--ink); }
  #form { display: flex; flex-direction: column; gap: 4px; }
  .composer-bar { display: flex; align-items: center; gap: 8px; }
  .composer-bar .send { margin-left: auto; }
  textarea {
    width: 100%;
    resize: none;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 6px 8px 2px;
    min-height: 48px;
    max-height: 200px;
    line-height: 1.5;
  }
  textarea:focus { outline: none; }
  button.ghost, button.send {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    flex: none;
  }
  button.ghost {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
  }
  button.ghost:hover { color: var(--ink); }
  button.send {
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #171717;
  }
  button.send:disabled { opacity: 0.35; cursor: default; }
  .err { color: #f2b8b5; }
  #viewer {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: rgba(0, 0, 0, 0.88);
    cursor: zoom-out;
  }
  #viewer[hidden] { display: none; }
  #viewer img {
    max-width: min(1100px, 94vw);
    max-height: 92vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
    background: transparent;
    cursor: zoom-out;
  }
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">
    <strong>Ryan</strong>
  </div>
  <button class="new" id="clear" type="button">New</button>
  <div id="meeting-list" style="display:flex;flex-direction:column;min-height:0;flex:1">
    <div class="side-label">Meetings</div>
    <ul id="meetings"></ul>
  </div>
  <div class="side-foot">
    <div class="side-label">Context</div>
    <ul id="notes"></ul>
    <form id="note-form">
      <input id="note-box" placeholder="Remember this" maxlength="2000">
    </form>
  </div>
</aside>
<div class="app">
  <div class="column">
    <header>
      <button class="menu" id="menu" type="button" aria-label="Open meetings"></button>
      <div class="meta" id="model">loading model…</div>
    </header>
    <div class="stage">
      <div id="log"></div>
      <div class="empty" id="empty">
        <strong>Ryan</strong>
        Talk through the next run, or switch to Report and paste the update.
      </div>
    </div>
    <div class="dock">
      <div id="pending"></div>
      <form id="form">
        <textarea id="box" rows="2" placeholder="Talk through the next run." autofocus></textarea>
        <div class="composer-bar">
          <div class="seg" id="pills">
            <button type="button" id="mode-talk" class="on">Talk</button>
            <button type="button" id="mode-report">Report</button>
          </div>
          <button class="ghost" id="attach" type="button" aria-label="Attach image">Image</button>
          <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <button class="send" id="send" type="submit" aria-label="Send">Send</button>
        </div>
      </form>
    </div>
  </div>
</div>
</div>
<div id="scrim" hidden></div>
<div id="viewer" hidden>
  <img id="viewer-img" alt="Expanded image">
</div>
<script>
const log = document.getElementById("log");
const box = document.getElementById("box");
const form = document.getElementById("form");
const sendBtn = document.getElementById("send");
let meetingId = null;
const pending = [];

fetch("/api/meta").then(r => r.json()).then(m => {
  document.getElementById("model").textContent = m.model;
}).catch(() => {
  document.getElementById("model").textContent = "no model";
});

let sendMode = "talk";

const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  menu: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};

function icon(name) {
  return `<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[name]}</svg></span>`;
}

function syncEmpty() {
  document.getElementById("empty").hidden = log.childElementCount > 0;
}

document.getElementById("clear").innerHTML = icon("plus") + "New chat";
document.getElementById("attach").innerHTML = icon("image");
document.getElementById("send").innerHTML = icon("send");
document.getElementById("menu").innerHTML = icon("menu");

const viewer = document.getElementById("viewer");
const aside = document.querySelector("aside");
const scrim = document.getElementById("scrim");

function openImage(src) {
  document.getElementById("viewer-img").src = src;
  viewer.hidden = false;
}

function closeImage() {
  viewer.hidden = true;
  document.getElementById("viewer-img").removeAttribute("src");
}

function closeSide() {
  aside.classList.remove("open");
  scrim.hidden = true;
}

viewer.addEventListener("click", closeImage);
scrim.addEventListener("click", closeSide);
document.getElementById("menu").addEventListener("click", () => {
  aside.classList.add("open");
  scrim.hidden = false;
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !viewer.hidden) closeImage();
});

log.addEventListener("click", (event) => {
  const img = event.target.closest(".shots img");
  if (!img) return;
  openImage(img.currentSrc || img.src);
});

function add(role, text, images, mode) {
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "ryan");
  if (role === "user" && mode === "report") {
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = "Report";
    el.appendChild(tag);
  }
  const body = document.createElement("div");
  if (role !== "user") {
    const head = document.createElement("div");
    head.className = "msg-head";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "Ryan";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "copy";
    copy.setAttribute("aria-label", "Copy reply");
    copy.innerHTML = icon("copy");
    copy.addEventListener("click", async () => {
      const value = body.innerText.trim();
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const area = document.createElement("textarea");
        area.value = value;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      copy.classList.add("done");
      copy.innerHTML = icon("check");
      copy.setAttribute("aria-label", "Copied");
      setTimeout(() => {
        copy.classList.remove("done");
        copy.innerHTML = icon("copy");
        copy.setAttribute("aria-label", "Copy reply");
      }, 1200);
    });
    head.append(who, copy);
    el.appendChild(head);
  }
  if (text) renderInto(body, text);
  if (images && images.length) {
    const shots = document.createElement("div");
    shots.className = "shots";
    for (const image of images) {
      const img = document.createElement("img");
      img.src = image.url || ("/api/attachments/" + image.id);
      img.alt = "Attached image";
      shots.appendChild(img);
    }
    body.appendChild(shots);
  }
  el.appendChild(body);
  log.appendChild(el);
  syncEmpty();
  el.scrollIntoView({ block: "start" });
  return body;
}

function renderPending() {
  const strip = document.getElementById("pending");
  strip.replaceChildren();
  pending.forEach((image, index) => {
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.src = image.dataUrl;
    img.alt = "Attached image";
    img.addEventListener("click", () => openImage(img.src));
    const remove = document.createElement("button");
    remove.type = "button";
    remove.innerHTML = icon("x");
    remove.setAttribute("aria-label", "Remove image");
    remove.addEventListener("click", () => {
      pending.splice(index, 1);
      renderPending();
    });
    thumb.append(img, remove);
    strip.appendChild(thumb);
  });
}

function addFile(file) {
  if (!file.type.startsWith("image/") || pending.length >= 4) return;
  const reader = new FileReader();
  reader.onload = () => {
    pending.push({ mime: file.type, dataUrl: reader.result });
    renderPending();
  };
  reader.readAsDataURL(file);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const HEADINGS = new Set([
  "Lo que puedo leer", "Lo que no cierra", "Cómo se lee mal", "Preguntas",
  "Qué tiene que quedar escrito", "Knee-jerk", "Claim I can read", "Failed gates",
  "Misread", "Questions", "What has to be in the doc", "What this shows",
  "What's missing", "Purpose", "Architecture", "Context", "Conclusion",
]);

const HEADING_LIST = [...HEADINGS].sort((a, b) => b.length - a.length);

function formatProse(text) {
  return text.split("\n").map((line) => {
    const trimmed = line.trim().replace(/[’‘]/g, "'");
    for (const name of HEADING_LIST) {
      if (trimmed === name || trimmed === name + "." || trimmed === name + ":") {
        return "<div class='h'>" + escapeHtml(name) + "</div>";
      }
      for (const sep of [". ", ": "]) {
        if (!trimmed.startsWith(name + sep)) continue;
        const rest = trimmed.slice((name + sep).length).trim();
        const head = "<div class='h'>" + escapeHtml(name) + "</div>";
        return rest ? head + escapeHtml(rest) : head;
      }
    }
    return escapeHtml(line);
  }).join("\n");
}

function renderInto(el, text) {
  const clean = text.replace(/^##\s+/gm, "");
  const fence = /```[a-zA-Z]*\n([\s\S]*?)```/g;
  let html = "";
  let last = 0;
  for (const match of clean.matchAll(fence)) {
    html += formatProse(clean.slice(last, match.index));
    html += "<pre class='ascii'>" + escapeHtml(match[1].replace(/\n$/, "")) + "</pre>";
    last = match.index + match[0].length;
  }
  html += formatProse(clean.slice(last));
  el.innerHTML = html;
}

function renderMeetings(meetings) {
  const list = document.getElementById("meetings");
  list.replaceChildren();
  for (const meeting of meetings) {
    const li = document.createElement("li");
    li.className = "meeting-row";
    const button = document.createElement("button");
    button.type = "button";
    button.className = "title";
    button.textContent = meeting.title;
    if (meeting.id === meetingId) button.classList.add("active");
    button.addEventListener("click", () => openMeeting(meeting.id));
    const rename = document.createElement("button");
    rename.type = "button";
    rename.className = "mini";
    rename.innerHTML = icon("pencil");
    rename.setAttribute("aria-label", "Rename meeting");
    rename.addEventListener("click", () => startRename(meeting, li));
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "mini";
    remove.innerHTML = icon("trash");
    remove.setAttribute("aria-label", "Delete meeting");
    remove.addEventListener("click", () => removeMeeting(meeting.id));
    li.append(button, rename, remove);
    list.appendChild(li);
  }
}

function startRename(meeting, row) {
  const input = document.createElement("input");
  input.className = "rename";
  input.value = meeting.title;
  row.querySelector(".title").replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const next = input.value.trim();
    if (save && next && next !== meeting.title) {
      await fetch("/api/meetings/" + meeting.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: next }),
      });
    }
    renderMeetings(await (await fetch("/api/meetings")).json());
  };
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      finish(true);
    }
    if (event.key === "Escape") {
      event.preventDefault();
      finish(false);
    }
  });
  input.addEventListener("blur", () => finish(true));
}

async function removeMeeting(id) {
  if (sendBtn.disabled) return;
  await fetch("/api/meetings/" + id, { method: "DELETE" });
  if (meetingId === id) {
    meetingId = null;
    log.replaceChildren();
  }
  renderMeetings(await (await fetch("/api/meetings")).json());
}

function renderNotes(notes) {
  const list = document.getElementById("notes");
  list.replaceChildren();
  for (const note of notes) {
    const li = document.createElement("li");
    li.className = "note-row";
    const text = document.createElement("button");
    text.type = "button";
    text.className = "note";
    text.textContent = note.body;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "x";
    remove.innerHTML = icon("x");
    remove.setAttribute("aria-label", "Delete note");
    remove.addEventListener("click", async () => {
      await fetch("/api/notes/" + note.id, { method: "DELETE" });
      renderNotes(await (await fetch("/api/notes")).json());
    });
    li.append(text, remove);
    list.appendChild(li);
  }
}

async function openMeeting(id) {
  if (sendBtn.disabled) return;
  meetingId = id;
  const [messages, meetings] = await Promise.all([
    fetch("/api/meetings/" + id).then(r => r.json()),
    fetch("/api/meetings").then(r => r.json()),
  ]);
  log.replaceChildren();
  for (const message of messages) add(message.role, message.content, message.images, message.mode);
  syncEmpty();
  renderMeetings(meetings);
  closeSide();
}

async function ask(text) {
  const trimmed = text.trim();
  const images = pending.slice();
  if ((!trimmed && !images.length) || sendBtn.disabled) return;
  pending.length = 0;
  renderPending();
  add("user", trimmed, images.map((image) => ({ url: image.dataUrl })), sendMode);
  box.value = "";
  sendBtn.disabled = true;
  const body = add("assistant", "");
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        meeting_id: meetingId,
        content: trimmed,
        mode: sendMode,
        images: images.map((image) => ({ mime: image.mime, data: image.dataUrl })),
      }),
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: response.statusText }));
      if (err.meeting_id) meetingId = err.meeting_id;
      renderMeetings(await (await fetch("/api/meetings")).json());
      body.textContent = "";
      body.parentElement.classList.add("err");
      body.textContent = err.error || "error";
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop() || "";
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const event = JSON.parse(line.slice(5));
        if (event.meeting) {
          meetingId = event.meeting.id;
          renderMeetings(await (await fetch("/api/meetings")).json());
        }
        if (event.d) {
          full += event.d;
          renderInto(body, full);
        }
      }
    }
    if (!full) body.parentElement.remove();
  } catch (error) {
    body.textContent = String(error);
  } finally {
    sendBtn.disabled = false;
    box.focus();
  }
}

function setMode(mode) {
  sendMode = mode;
  document.getElementById("mode-talk").classList.toggle("on", mode === "talk");
  document.getElementById("mode-report").classList.toggle("on", mode === "report");
  box.placeholder = mode === "report"
    ? "Title, why this experiment, and the numbers."
    : "Talk through the next run.";
}
document.getElementById("mode-talk").addEventListener("click", () => setMode("talk"));
document.getElementById("mode-report").addEventListener("click", () => setMode("report"));

form.addEventListener("submit", (event) => {
  event.preventDefault();
  ask(box.value);
});
document.getElementById("attach").addEventListener("click", () => {
  document.getElementById("file").click();
});
document.getElementById("file").addEventListener("change", (event) => {
  for (const file of event.target.files) addFile(file);
  event.target.value = "";
});
box.addEventListener("paste", (event) => {
  const files = [...event.clipboardData.files].filter((file) => file.type.startsWith("image/"));
  if (!files.length) return;
  event.preventDefault();
  files.forEach(addFile);
});
function fitBox() {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 200) + "px";
}
box.addEventListener("input", fitBox);
box.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
document.getElementById("clear").addEventListener("click", () => {
  if (sendBtn.disabled) return;
  meetingId = null;
  log.replaceChildren();
  syncEmpty();
  closeSide();
  fetch("/api/meetings").then(r => r.json()).then(renderMeetings);
  box.focus();
});
document.getElementById("note-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const body = document.getElementById("note-box").value.trim();
  if (!body) return;
  await fetch("/api/notes", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ body }),
  });
  document.getElementById("note-box").value = "";
  renderNotes(await (await fetch("/api/notes")).json());
});
// Startup opens a new chat; past meetings stay available in the sidebar.
fetch("/api/meetings").then(r => r.json()).then(renderMeetings);
fetch("/api/notes").then(r => r.json()).then(renderNotes);
</script>
